<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incremental Stream Game</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script type="module">
    import { firebaseConfig } from './config.js';
    window.firebaseConfig = firebaseConfig;
  </script>
</head>
<body>
  <div class="container">
    <div id="global-card-tooltip"></div>

    <!-- ====================================================================
         1. TOP BAR: Sound Toggle | Title/Logo | Menu Icon
         ==================================================================== -->
    <div class="top-nav-bar">
      <!-- Mute/Sound Button -->
      <button id="sound-toggle-btn" class="top-tool-btn" title="Toggle Audio">🔊</button>

      <!-- GAME LOGO (Replace text with <img src="images/logo.png" class="logo-img"> later) -->
      <h1 class="game-logo">STITCHES</h1>

      <!-- Hamburger Menu for Settings & Stats -->
      <button id="menu-toggle-btn" class="top-tool-btn" title="Menu">☰</button>
    </div>

    <!-- ====================================================================
         2. PURPLE PILL BANNER: Notification & Stitches Counter
         ==================================================================== -->
    <div class="purple-pill-banner">
      <div id="game-notify">Connecting...</div>
      <div id="game-ui" style="display: none;">
        <span id="score">0</span> Stitches<br>
        <span id="pps">1</span> /s
      </div>
    </div>  

    <!-- ====================================================================
         3. EQUIPPED CARDS ROW (4 Pinned Slots Front-and-Center)
         ==================================================================== -->
    <div class="equipped-shelf">
      <div class="slots-grid">
        <div class="slot bronze">Bronze</div>
        <div class="slot bronze">Bronze</div>
        <div class="slot silver">Silver</div>
        <div class="slot gold">Gold</div>
      </div>
    </div>

    <!-- ====================================================================
         4. BIG CENTERPIECE CLICKER (Ready for custom skins/images)
         ==================================================================== -->
    <div class="centerpiece-area">
      <div id="join-container" style="display:none;">
        <button id="join-btn" class="main-btn">Join Game</button>
      </div>

      <!-- THE MAIN ROUND CLICK BUTTON -->
      <button id="click-btn" class="round-clicker-btn" disabled>
        <!-- PLACEHOLDER FOR CLICKER SKIN (e.g. <img src="images/button_skin.png">) -->
        <span id="clicker-icon">🧵</span>
      </button>
    </div>

    <!-- ====================================================================
         5. BOTTOM 3-ICON NAVIGATION DOCK
         ==================================================================== -->
    <div class="bottom-dock-nav">
      <!-- 1. Crafting Tab Button -->
      <button id="nav-crafting" class="dock-btn">
        <!-- PLACEHOLDER: Replace 🥣 with <img src="images/bowl_icon.png" class="dock-img"> -->
        <span class="dock-icon">🥣</span>
        <span class="dock-label">Craft</span>
      </button>

      <!-- 2. Notions Tab Button -->
      <button id="nav-notions" class="dock-btn">
        <!-- PLACEHOLDER: Replace 🎴 with <img src="images/cards_icon.png" class="dock-img"> -->
        <span class="dock-icon">🎴</span>
        <span class="dock-label">My Stuff</span>
      </button>

      <!-- 3. Shop Tab Button -->
      <button id="nav-shop" class="dock-btn">
        <!-- PLACEHOLDER: Replace 🧵 with <img src="images/machine_icon.png" class="dock-img"> -->
        <span class="dock-icon">🧵</span>
        <span class="dock-label">Shop</span>
      </button>
    </div>

    <!-- ====================================================================
         6. TAB OVERLAYS / DRAWERS
         ==================================================================== -->
    <!-- 1. Notions Tab Drawer -->
    <div id="tab-notions" class="tab-content" style="display:none;">
      <span class="drawer-close-btn" onclick="closeAllDrawers()">✕</span>
      <h3>Owned Notions</h3>
      <div id="owned-notions-list"></div>
    </div>

    <!-- 2. Crafting Tab Drawer -->
    <div id="tab-crafting" class="tab-content" style="display:none;">
      <span class="drawer-close-btn" onclick="closeAllDrawers()">✕</span>
      <h3>Crafting</h3>
      <div id="crafting-items-container"></div>
    </div>

    <!-- 3. Shop Tab Drawer -->
    <div id="tab-shop" class="tab-content" style="display:none;">
      <span class="drawer-close-btn" onclick="closeAllDrawers()">✕</span>
      <h3 id="toggle-machines" class="collapsible-header">
        <span>Machines & Equipment</span>
        <span id="machines-arrow">▼</span>
      </h3>
      <div id="shop-items-container"></div>

      <h3>Notion Cards</h3>
      <div id="shop-notions-container" class="notions-grid"></div>
    </div>

    <!-- 4. Menu / Settings Tab Drawer -->
    <div id="tab-menu" class="tab-content" style="display:none;">
      <span class="drawer-close-btn" onclick="closeAllDrawers()">✕</span>
      <h3>Menu & Settings</h3>
      <div class="menu-section">
        <button id="quit-btn" class="main-btn" style="background-color: #ff4444; margin-bottom: 5px;">Quit Game</button>
        <button id="manual-save-btn" class="main-btn save-action-btn">Save Game</button>
      </div>
      <div class="menu-section">
        <h4>Stats</h4>
        <div class="stat-row"><span>Player ID:</span> <span id="stat-user">Loading...</span></div>
        <div class="stat-row"><span>Total Stitches:</span> <span id="stat-total-stitches">0</span></div>
        <div class="stat-row"><span>Current SPM:</span> <span id="stat-total-spm">1</span></div>
      </div>
    </div>
  </div> 
  </div> 

 
  <script src="gameData.js"></script>
  <script src="panel.js"></script>
</body>
</html>
